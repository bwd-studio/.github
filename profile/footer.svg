<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-label="A paper boat sailing">
<title>A paper boat sailing</title><defs><style>
@keyframes sail{from{transform:translateX(-120px)}to{transform:translateX(1240px)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-200px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(3deg)}}
.sail{animation:sail 26s linear infinite} .bob{transform-box:fill-box;transform-origin:center bottom;animation:bob 3.2s ease-in-out infinite}
.w1{animation:drift 9s linear infinite} .w2{animation:drift 14s linear infinite reverse}</style>
